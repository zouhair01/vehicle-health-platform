spring.application.name=telemetry-service
server.port=8081

spring.datasource.url=${TELEMETRY_DB_URL:jdbc:postgresql://localhost:5433/telemetry}
spring.datasource.username=${TELEMETRY_DB_USERNAME:telemetry}
spring.datasource.password=${TELEMETRY_DB_PASSWORD:telemetry}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.datasource.url=${TELEMETRY_DB_URL:jdbc:postgresql://localhost:5433/telemetry}
spring.datasource.username=${TELEMETRY_DB_USERNAME:telemetry}
spring.datasource.password=${TELEMETRY_DB_PASSWORD:telemetry}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.acks=all
app.kafka.topics.telemetry-received=vehicle.telemetry.received
