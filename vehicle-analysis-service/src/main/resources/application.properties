spring.application.name=vehicle-analysis-service
server.port=8082
app.recall-provider.base-url=${RECALL_PROVIDER_URL:http://localhost:8089}
app.recall-provider.connect-timeout=2s
app.recall-provider.read-timeout=3s

spring.datasource.url=${ANALYSIS_DB_URL:jdbc:postgresql://localhost:5434/vehicle_analysis}
spring.datasource.username=${ANALYSIS_DB_USERNAME:analysis}
spring.datasource.password=${ANALYSIS_DB_PASSWORD:analysis}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
