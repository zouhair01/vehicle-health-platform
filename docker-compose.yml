services:
  telemetry-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10

  analysis-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vehicle_analysis
      POSTGRES_USER: analysis
      POSTGRES_PASSWORD: analysis
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analysis -d vehicle_analysis"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  recall-provider:
    image: wiremock/wiremock:3.13.1
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./wiremock:/home/wiremock
    ports:
      - "8089:8080"

  telemetry-service:
    profiles: ["app"]
    build: ./telemetry-service
    image: telemetry-service:1.0.0
    environment:
      TELEMETRY_DB_URL: jdbc:postgresql://telemetry-db:5432/telemetry
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      telemetry-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  vehicle-analysis-service:
    profiles: ["app"]
    build: ./vehicle-analysis-service
    image: vehicle-analysis-service:1.0.0
    environment:
      ANALYSIS_DB_URL: jdbc:postgresql://analysis-db:5432/vehicle_analysis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RECALL_PROVIDER_URL: http://recall-provider:8080
    ports:
      - "8082:8082"
    depends_on:
      analysis-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      recall-provider:
        condition: service_started
